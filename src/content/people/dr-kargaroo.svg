<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dk-title dk-desc">
  <title id="dk-title">Dr Kargaroo</title>
  <desc id="dk-desc">A cartoon kangaroo with a bandaged head and one arm in a triangular sling, giving a thumbs up with the other.</desc>

  <rect width="400" height="400" fill="#f6efe0"/>

  <!-- tail -->
  <path d="M 245 300 C 310 305 355 270 378 215 C 383 202 368 194 358 205 C 338 245 300 268 240 272 Z"
        fill="#caa06a" stroke="#211f1c" stroke-width="6" stroke-linejoin="round"/>
  <g transform="translate(348,220) rotate(25)">
    <rect x="-18" y="-9" width="36" height="18" rx="7" fill="#fdfaf3" stroke="#211f1c" stroke-width="3.5"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#d1477a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#d1477a" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- body -->
  <ellipse cx="205" cy="275" rx="92" ry="80" fill="#caa06a" stroke="#211f1c" stroke-width="6"/>
  <ellipse cx="205" cy="296" rx="54" ry="44" fill="#efe6d1"/>

  <!-- feet -->
  <ellipse cx="163" cy="350" rx="40" ry="21" fill="#a87f4c" stroke="#211f1c" stroke-width="6"/>
  <ellipse cx="252" cy="350" rx="40" ry="21" fill="#a87f4c" stroke="#211f1c" stroke-width="6"/>

  <!-- good arm, raised thumbs up -->
  <path d="M 130 255 C 102 240 90 205 100 178 C 106 163 128 165 130 182 C 134 208 138 230 150 245 Z"
        fill="#caa06a" stroke="#211f1c" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="101" cy="175" r="13" fill="#caa06a" stroke="#211f1c" stroke-width="6"/>
  <path d="M 96 166 L 92 152" stroke="#211f1c" stroke-width="5" stroke-linecap="round"/>

  <!-- sling holding the other arm -->
  <path d="M 252 205 L 305 292 L 238 278 Z"
        fill="#fdfaf3" stroke="#211f1c" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="262" cy="272" r="18" fill="#caa06a" stroke="#211f1c" stroke-width="6"/>

  <!-- head -->
  <circle cx="205" cy="150" r="88" fill="#caa06a" stroke="#211f1c" stroke-width="6"/>

  <!-- ears -->
  <path d="M 148 92 C 132 56 142 18 168 24 C 184 46 178 82 168 108 Z"
        fill="#caa06a" stroke="#211f1c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 242 92 C 258 56 248 18 222 24 C 206 46 212 82 222 108 Z"
        fill="#caa06a" stroke="#211f1c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 156 90 C 149 66 154 42 168 40 C 178 56 175 78 167 98 Z" fill="#e9c79a"/>
  <path d="M 234 90 C 241 66 236 42 222 40 C 212 56 215 78 223 98 Z" fill="#e9c79a"/>

  <!-- bandage wrapped across the head -->
  <path d="M 122 132 C 165 104 245 104 288 132 L 282 160 C 240 135 170 135 128 160 Z"
        fill="#fdfaf3" stroke="#211f1c" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="288" cy="142" r="13" fill="#fdfaf3" stroke="#211f1c" stroke-width="4.5"/>
  <line x1="197" y1="128" x2="213" y2="128" stroke="#d1477a" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="205" y1="120" x2="205" y2="136" stroke="#d1477a" stroke-width="4.5" stroke-linecap="round"/>

  <!-- face -->
  <circle cx="180" cy="168" r="7.5" fill="#211f1c"/>
  <circle cx="230" cy="168" r="7.5" fill="#211f1c"/>
  <circle cx="177" cy="165" r="2.4" fill="#fff"/>
  <circle cx="227" cy="165" r="2.4" fill="#fff"/>
  <ellipse cx="168" cy="190" rx="11" ry="6.5" fill="#e79ba0" opacity="0.65"/>
  <ellipse cx="242" cy="190" rx="11" ry="6.5" fill="#e79ba0" opacity="0.65"/>
  <path d="M 199 182 Q 205 190 211 182" fill="none" stroke="#211f1c" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 178 203 Q 205 218 232 203" fill="none" stroke="#211f1c" stroke-width="4.5" stroke-linecap="round"/>

  <!-- a couple of dizzy stars for comic effect -->
  <path d="M 95 78 L 100 92 L 114 94 L 103 103 L 106 117 L 95 109 L 84 117 L 87 103 L 76 94 L 90 92 Z"
        fill="#d1477a"/>
  <path d="M 322 100 L 325 109 L 334 111 L 327 117 L 329 127 L 322 121 L 315 127 L 317 117 L 310 111 L 319 109 Z"
        fill="#d1477a"/>
</svg>
